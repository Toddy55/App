name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *' # monthly: refresh the built-in course list

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Download every South East Queensland golf course from OpenStreetMap into the app.
      # If the map server is down, the build carries on with the list it already has.
      - name: Build the course list
        run: npx tsx scripts/build-course-catalog.ts
        continue-on-error: true
      - run: npx vitest run
      - run: npm run build
        env:
          # Firebase web config for live scoring (Settings → Secrets and variables → Actions → Variables)
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 17 * * *' # daily (3:23am in Brisbane): keep trying for fresh course data
    - cron: '7 0 * * *' # daily (10:07am in Brisbane), just after GolfCourseAPI's daily allowance resets: club tees

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Start from the course list that's already live, then download every South East
      # Queensland course from OpenStreetMap on top. Anything the map servers don't
      # return this time is kept from the live list.
      - name: Start from the live course list
        run: node scripts/fetch-live-catalog.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        continue-on-error: true
      - name: Build the course list
        # Pull request checks just use the live list (the download can take a while when the map servers are busy)
        if: github.event_name != 'pull_request'
        run: npx tsx scripts/build-course-catalog.ts
        continue-on-error: true
        # Updates go live in a few minutes even when the map servers are slow (the live list is used instead);
        # the nightly run gets longer to fetch fresh course data
        timeout-minutes: ${{ github.event_name == 'schedule' && 45 || 6 }}
      # Daily, just after the allowance resets at midnight UTC: look up club tees (lengths, pars, ratings)
      # for courses that don't have them yet. Can also be run by hand (Actions → Deploy → Run workflow).
      # Needs the GolfCourseAPI key as a repo secret (Settings → Secrets and variables → Actions → GOLFCOURSEAPI_KEY).
      - name: Club tees for new courses
        if: github.event.schedule == '7 0 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GOLFCOURSEAPI_KEY: ${{ secrets.GOLFCOURSEAPI_KEY }}
        # The free plan allows ~50 requests a day, so each day carries on from the live app's list
        run: |
          if [ -n "$GOLFCOURSEAPI_KEY" ]; then
            npx tsx scripts/fetch-course-tees.ts "--from=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/course-tees.json"
          else
            echo "No GOLFCOURSEAPI_KEY secret: using the saved tees"
          fi
        continue-on-error: true
        timeout-minutes: 20
      - run: npx vitest run
      - run: npm run build
        env:
          # Firebase web config for live scoring (Settings → Secrets and variables → Actions → Variables)
          VITE_FIREBASE_CONFIG: ${{ vars.VITE_FIREBASE_CONFIG }}
      # A plain copy of the course list, so the next build can fall back to it.
      - run: cp src/data/seq-courses.json dist/seq-courses.json
      # And the club tees, so the next nightly lookup carries on from here
      - run: cp src/data/course-tees.json dist/course-tees.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
